<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>Swiftshare</title>
<style>
:root{--bg:#eef2f4;--cd:#fff;--tx:#10201f;--mu:#5f7270;--ac:#0f766e;--on:#fff;--bd:#d5dfe0;--dg:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d1415;--cd:#162022;--tx:#e6efee;--mu:#8fa5a3;--ac:#2dd4bf;--on:#062a27;--bd:#253436;--dg:#f97066}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:960px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;max-width:720px;margin:0 auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{resize:vertical;min-height:90px}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
button.d{color:var(--dg)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row>*{flex:0 0 auto}.row .g{flex:1}
.txt{white-space:pre-wrap;word-break:break-word;max-height:9em;overflow:auto}
.meta{color:var(--mu);font-size:13px;margin-top:4px}
img.th{max-width:100%;max-height:200px;border-radius:8px;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:16px 0;background:none;color:var(--mu);font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.chips button{white-space:nowrap}.chips .on{background:var(--ac);color:var(--on)}
#login{padding:16px 0}
#pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pc{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px}.pc.w{grid-column:1/3}
.pt{min-height:36vh}.pc.w .pt{min-height:20vh}.pn{font-weight:600;margin-bottom:6px;padding:6px 8px}#pg.st{grid-template-columns:1fr}#pg.st .pc.w{grid-column:auto}.hide{display:none!important}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(92vw,380px)}
</style></head><body>
<div id="login"><main><h1 style="font-size:28px;text-align:center;margin:8px 0 14px">Swiftshare</h1>
<div class="card"><input id="le" type="email" autocomplete="username" placeholder="Email"><input id="lp" type="password" autocomplete="current-password" placeholder="Password" style="margin-top:8px">
<div class="row"><button class="p g" id="ei">Sign in</button><button class="g" id="go">Google</button></div>
<div class="row"><button id="lr">Set or reset password</button><button class="inst hide">Install app</button></div><div class="meta" id="lerr"></div></div>
<div class="card"><b>Quick pad</b><div class="meta">Works without signing in. Saved on this device only.</div>
<textarea id="lpad" style="min-height:28vh;margin-top:8px" placeholder="Type notes here before you sign in"></textarea><div class="row"><button id="lcopy">Copy</button></div></div></main></div>
<div id="app" class="hide">
<header><h1>Swiftshare</h1><span><button class="inst hide">Install</button> <button id="out">Sign out</button></span></header>
<main>
<section id="t-clip">
 <div class="card"><textarea id="ci" placeholder="Type or paste text to send to your other device"></textarea>
 <div class="row"><button class="p" id="send">Send</button><button id="pst">Paste and send</button><label class="g"><button style="width:100%" onclick="this.nextElementSibling.click()">Add file</button><input type="file" id="cf" multiple class="hide"></label></div></div>
 <div id="cl"></div></section>
<section id="t-pad" class="hide"><div class="row" style="margin:0 0 8px"><button class="p" id="sy">Sync now</button><span class="meta g" id="ps">…</span><button id="lt">Layout</button><button id="pl">Add quick pad</button></div><div id="pg"><div class="pc"><input class="pn" id="la" value="Pad 1" aria-label="Pad title"><textarea id="a" class="pt" placeholder="Type here"></textarea><div class="row"><button class="p g" data-cp="a">Copy</button><button class="d" data-cl="a">Clear</button></div></div><div class="pc"><input class="pn" id="lb" value="Pad 2" aria-label="Pad title"><textarea id="b" class="pt" placeholder="Type here"></textarea><div class="row"><button class="p g" data-cp="b">Copy</button><button class="d" data-cl="b">Clear</button></div></div><div class="pc w"><input class="pn" id="li" value="Impression" aria-label="Pad title"><textarea id="i" class="pt" placeholder="Type here"></textarea><div class="row"><button class="p g" data-cp="i">Copy</button><button class="d" data-cl="i">Clear</button></div></div></div></section>
<section id="t-vault" class="hide"><div class="card"><div class="row" style="margin:0"><select id="vt" class="g"><option>Signature</option><option>Photo</option><option>Certificate</option><option>ID</option><option>Other</option></select>
 <button class="p" onclick="vf.click()">Upload to vault</button><input type="file" id="vf" multiple class="hide"></div>
 <div class="meta">Images are compressed to under 700 KB. PDFs and other files can be up to 6 MB.</div></div>
 <div class="chips" id="vc"></div><div id="vl"></div></section>
</main>
<nav><button data-t="clip" class="on">Clipboard</button><button data-t="pad">Pad</button><button data-t="vault">Vault</button></nav></div>
<dialog id="dz"><b>Resize image for upload</b><div class="row"><button data-k="50" data-p="300">Signature 50 KB</button><button data-k="200" data-p="600">Photo 200 KB</button><button data-k="300" data-p="1200">Certificate 300 KB</button></div>
<div class="row"><input id="zk" type="number" placeholder="Max KB" style="width:46%"><input id="zp" type="number" placeholder="Max px" style="width:46%"></div>
<div class="row"><button class="p" id="zg">Download resized</button><button id="zc">Cancel</button></div></dialog>
<div id="toast"></div>
<script>
const lp=document.getElementById("lpad"),K="ss-local-pad";lp.value=localStorage.getItem(K)||"";lp.oninput=()=>localStorage.setItem(K,lp.value);
document.getElementById("lcopy").onclick=()=>navigator.clipboard.writeText(lp.value);
let ip;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;document.querySelectorAll(".inst").forEach(b=>b.classList.remove("hide"))});
document.querySelectorAll(".inst").forEach(b=>b.onclick=async()=>{ip.prompt();await ip.userChoice;ip=null;document.querySelectorAll(".inst").forEach(x=>x.classList.add("hide"))});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,setDoc,deleteDoc,onSnapshot,getDocs,getDocFromServer,waitForPendingWrites,disableNetwork,enableNetwork,query,orderBy,limit,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCycW4ktbTN5MBSGekAXvHcq6eh91IhmP8",authDomain:"swiftshare-c4006.firebaseapp.com",projectId:"swiftshare-c4006",storageBucket:"swiftshare-c4006.firebasestorage.app",messagingSenderId:"1029761340395",appId:"1:1029761340395:web:3397c80f3b9b3859acbfae"});
const auth=getAuth(app),db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=s=>document.querySelector(s),MAX=700*1024,BIG=6*1048576,CH=800000;let uid,tag="All",vault=[],zi=null;
const col=n=>collection(db,"users",uid,n),toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),1800)};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kb=n=>n>1024*1024?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB";
$("#go").onclick=async()=>{const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(e){signInWithRedirect(auth,p)}};
$("#out").onclick=()=>signOut(auth);
const em=m=>$("#lerr").textContent=m;
$("#ei").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("#le").value.trim(),$("#lp").value)}catch{em("Sign-in failed. Check your email and password, or use Set or reset password.")}};
$("#lr").onclick=async()=>{const m=$("#le").value.trim();if(!m)return em("Enter your email first.");try{await sendPasswordResetEmail(auth,m);em("Check your email for a link to set your password.")}catch{em("Could not send the email. Check the address.")}};
$("#pl").onclick=()=>{const t=localStorage.getItem("ss-local-pad");if(!t)return toast("Quick pad is empty");const p=$("#a");p.value=(p.value?p.value+"\n\n":"")+t;p.oninput();localStorage.removeItem("ss-local-pad");toast("Quick pad added")};
onAuthStateChanged(auth,u=>{$("#login").classList.toggle("hide",!!u);$("#app").classList.toggle("hide",!u);if(u&&u.uid!==uid){uid=u.uid;start()}});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));["clip","pad","vault"].forEach(t=>$("#t-"+t).classList.toggle("hide",t!=b.dataset.t))});
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast("Copied")}catch{toast("Copy blocked. Tap in the box and copy manually.")}};
const rd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function shrink(file,maxKB,maxPx){const bm=await createImageBitmap(file);let s=Math.min(1,maxPx/Math.max(bm.width,bm.height)),q=.92,b;
 for(let i=0;i<30;i++){const c=document.createElement("canvas");c.width=Math.max(1,bm.width*s|0);c.height=Math.max(1,bm.height*s|0);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(b.size<=maxKB*1024)return b;if(q>.45)q-=.1;else s*=.85}return b}
async function addFile(file,c,extra={}){let b=file,name=file.name;
 if(file.type.startsWith("image/")&&file.size>MAX*.9){b=await shrink(file,MAX/1024*.95,2400);name=name.replace(/\.\w+$/,"")+".jpg"}
 if(b.size>BIG)return toast(name+" is over 6 MB");
 const data=await rd(b),meta={kind:"file",name,mime:b.type||"application/octet-stream",size:b.size,...extra,ts:serverTimestamp()};
 if(data.length<=CH)await addDoc(col(c),{...meta,data});
 else{const ref=doc(col(c)),ps=[];for(let i=0;i<data.length;i+=CH)ps.push(data.slice(i,i+CH));
  await Promise.all(ps.map((p,i)=>setDoc(doc(db,"users",uid,c,ref.id,"parts","p"+String(i).padStart(3,"0")),{d:p})));await setDoc(ref,{...meta,n:ps.length})}
 toast("Saved "+name)}
async function getData(d,c){if(d.data)return d.data;const s=await getDocs(query(collection(db,"users",uid,c,d.id,"parts"),orderBy("__name__")));return s.docs.map(x=>x.data().d).join("")}
const card=(d,c,id)=>{const f=d.kind=="file",img=f&&d.mime.startsWith("image/");
 return`<div class="card" data-c="${c}" data-id="${id}">${f?(img?`<img class="th" src="${d.data}" alt="${esc(d.name)}">`:"")+`<b>${esc(d.name)}</b><div class="meta">${kb(d.size)}${d.tag?" · "+esc(d.tag):""}</div>`:`<div class="txt">${esc(d.text)}</div>`}
 <div class="row">${f?`<button data-a="dl">Download</button>`+(img?`<button data-a="rs">Resize</button>`:""):`<button class="p" data-a="cp">Copy</button>`}<button class="d" data-a="rm">Delete</button></div></div>`};
const store={clips:[],vault:[]};
document.addEventListener("click",async e=>{const a=e.target.dataset.a,c=e.target.closest("[data-c]");if(!a||!c)return;const n=c.dataset.c,d=store[n].find(x=>x.id==c.dataset.id);
 if(a=="cp")copy(d.text);
 if(a=="rm"&&confirm("Delete this item?")){if(d.n){const s=await getDocs(collection(db,"users",uid,n,d.id,"parts"));await Promise.all(s.docs.map(x=>deleteDoc(x.ref)))}deleteDoc(doc(db,"users",uid,n,d.id))}
 if(a=="dl"){toast("Preparing…");const b=await(await fetch(await getData(d,n))).blob(),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=d.name;l.click()}
 if(a=="rs"){zi=d;$("#dz").showModal()}});
document.querySelectorAll("#dz [data-k]").forEach(b=>b.onclick=()=>{$("#zk").value=b.dataset.k;$("#zp").value=b.dataset.p});
$("#zc").onclick=()=>$("#dz").close();
$("#zg").onclick=async()=>{const k=+$("#zk").value,p=+$("#zp").value;if(!k||!p)return toast("Enter max KB and max px");const f=await(await fetch(zi.data)).blob();const b=await shrink(f,k,p);
 const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=zi.name.replace(/\.\w+$/,"")+`_${kb(b.size).replace(" ","")}.jpg`;l.click();toast("Resized to "+kb(b.size)+(b.size>k*1024?" (could not reach target)":""));$("#dz").close()};
function start(){
 onSnapshot(query(col("clips"),orderBy("ts","desc"),limit(50)),s=>{store.clips=s.docs.map(x=>({id:x.id,...x.data()}));$("#cl").innerHTML=store.clips.map(d=>card(d,"clips",d.id)).join("")||'<p class="meta">Nothing here yet. Send text or a file from this device and it appears on your other one.</p>'});
 onSnapshot(query(col("vault"),orderBy("ts","desc")),s=>{store.vault=s.docs.map(x=>({id:x.id,...x.data()}));drawV()});
 const F=["a","b","i"],L={a:"la",b:"lb",i:"li"},pr=doc(db,"users",uid,"pad","main"),dirty={},tm={},fld=k=>$("#"+k),ps=t=>$("#ps").textContent=t;
const put=(k,v)=>setDoc(pr,{[k]:v,ts:serverTimestamp()},{merge:true});
const flush=()=>{for(const k in dirty){clearTimeout(tm[k]);const v=dirty[k];delete dirty[k];put(k,v)}};
const apply=(d,force)=>F.forEach(k=>{const v=d[k]??(k=="a"?d.text:"")??"";if(!(k in dirty)&&(force||document.activeElement!==fld(k))&&fld(k).value!==v)fld(k).value=v;const l=d[L[k]];if(l&&!(L[k] in dirty)&&document.activeElement!==fld(L[k]))fld(L[k]).value=l});
const st=s=>ps(!navigator.onLine?"Offline. Saved on this device":s.metadata.hasPendingWrites?"Saving…":s.metadata.fromCache?"Waiting for server…":"Synced");
onSnapshot(pr,{includeMetadataChanges:true},s=>{apply(s.data()||{});st(s)});
F.flatMap(k=>[k,L[k]]).forEach(k=>{fld(k).oninput=()=>{dirty[k]=fld(k).value;ps("Typing…");clearTimeout(tm[k]);tm[k]=setTimeout(()=>{const v=dirty[k];delete dirty[k];put(k,v)},250)};fld(k).onblur=flush});
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});addEventListener("pagehide",flush);
document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(fld(b.dataset.cp).value));
document.querySelectorAll("[data-cl]").forEach(b=>b.onclick=()=>{const k=b.dataset.cl;if(fld(k).value&&!confirm("Clear this pad on all devices?"))return;fld(k).value="";delete dirty[k];put(k,"")});
$("#sy").onclick=async()=>{ps("Syncing…");flush();try{await disableNetwork(db);await enableNetwork(db);await Promise.race([waitForPendingWrites(db),new Promise((_,j)=>setTimeout(j,10000))]);apply((await getDocFromServer(pr)).data()||{},true);ps("Synced");toast("Synced")}catch{ps("Sync failed. Check internet, then tap Sync now");toast("Sync failed")}};
addEventListener("online",()=>$("#sy").click());addEventListener("offline",()=>ps("Offline. Saved on this device"));
const ly=()=>$("#pg").classList.toggle("st",localStorage.getItem("ss-lay")=="st");ly();$("#lt").onclick=()=>{localStorage.setItem("ss-lay",localStorage.getItem("ss-lay")=="st"?"sb":"st");ly()};
shared()}
const sendT=async t=>{t=t.trim();if(!t)return;await addDoc(col("clips"),{kind:"text",text:t,ts:serverTimestamp()});toast("Sent")};
$("#send").onclick=async()=>{await sendT($("#ci").value);$("#ci").value=""};
$("#pst").onclick=async()=>{try{await sendT(await navigator.clipboard.readText())}catch{toast("Allow clipboard access, or paste into the box")}};
$("#cf").onchange=async e=>{for(const f of e.target.files)await addFile(f,"clips");e.target.value=""};
document.addEventListener("paste",async e=>{const fs=[...(e.clipboardData?.files||[])];if(fs.length){e.preventDefault();for(const f of fs)await addFile(f,"clips")}});
$("#vf").onchange=async e=>{for(const f of e.target.files)await addFile(f,"vault",{tag:$("#vt").value});e.target.value=""};
function drawV(){const tags=["All",...new Set(vault.concat(store.vault).map(d=>d.tag).filter(Boolean))];$("#vc").innerHTML=tags.map(t=>`<button class="${t==tag?"on":""}" data-tg="${esc(t)}">${esc(t)}</button>`).join("");
 $("#vl").innerHTML=store.vault.filter(d=>tag=="All"||d.tag==tag).map(d=>card(d,"vault",d.id)).join("")||'<p class="meta">Your vault is empty. Upload your signature, photo and certificates once, then reach them from anywhere.</p>'}
$("#vc").onclick=e=>{if(e.target.dataset.tg){tag=e.target.dataset.tg;drawV()}};
async function shared(){if(!location.search.includes("share=1"))return;history.replaceState(null,"","./");const c=await caches.open("share"),n=+(await(await c.match("n"))?.text()||0);
 const t=await(await c.match("t"))?.text();if(t)await sendT(t);
 for(let i=0;i<n;i++){const r=await c.match("f"+i);if(!r)continue;const b=await r.blob();await addFile(new File([b],decodeURIComponent(r.headers.get("x-name")||"shared"),{type:b.type}),"clips")}
 for(const k of await c.keys())c.delete(k)}
</script></body></html>
